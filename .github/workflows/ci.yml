name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动补跑：任何分支（含 main）都能手动跑一遍 CI。注意它不能顶替发布 PR 的
  # 必需检查——workflow_dispatch 的运行不挂在 PR 上；要解除 BLOCKED，得让 owner
  # 重新触发 pull_request（gh pr close && gh pr reopen，见 CONTRIBUTING.md）。
  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Verify generated bundle is committed
        run: git diff --exit-code -- lib locale
      - name: Run tests
        run: node tests/run-all.mjs
