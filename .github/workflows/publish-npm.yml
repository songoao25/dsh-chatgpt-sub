name: Publish NPM package

# 这个 job 的契约只有一条：**只发不等**。
#
# npm 的发布是异步的：`npm publish` 返回 0 只代表「已受理」，版本要等服务端扫描/校验
# （生命周期状态 validating）结束后才会公开可下载。实测「上传完成 → 公开可下载」的延迟：
#   2026-09-26  v1.20.4~v1.20.8   74s ~ 157s
#   2026-09-30  v1.20.9           1098s（≈18 分钟）
#   2026-09-30  v1.20.10          >25 分钟
#
# 一旦把「等它公开」写进这个 job，发包耗时就等于 npm 的服务端队列耗时 ——
# 2026-09-30 v1.20.10 正是这样从几十秒变成十几分钟、并且常常判红的。
#
# 公开可用性改由独立的 verify-npm-release.yml 后台读回校验，不阻塞这里。
#
# 认证：仓库 secret DSH_CHATGPT_SUB_NPM_TOKEN（npm granular access token）。
# 做法与底部信息栏插件一致（那边这个 secret 叫 NPM_TOKEN）。
# 生成方式：npm 网站 → Access Tokens → Generate New Token →
#   Packages 权限选 "Read and write (publish and stage)"、覆盖 All Packages、
#   勾上 "Bypass two-factor authentication"（CI 里没法输手机验证码，必须勾）。
# 注意 1：2026-08 起，带 Bypass 2FA 的 token 会被拒绝「账户身份类」查询，
#   所以 npm whoami 不再能当判据（下面降级为警告），真正的判据是 publish 本身。
# 注意 2：npm 已宣布用 token 直接发布将在 2027-01 移除，届时改用可信发布（OIDC）。
on:
  push:
    tags:
      - 'v*.*.*'
  # 手动兜底：自动链断了还能人工发版（幂等，重跑已发布版本不会判红）。
  workflow_dispatch:
    inputs:
      verify_only:
        description: Check publishing authentication without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish dsh-chatgpt-sub to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "Tag version $tag_version does not match package version $package_version"
              exit 1
            fi
          fi
          echo "Releasing dsh-chatgpt-sub@$package_version"

      - name: Check npm publishing token
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DSH_CHATGPT_SUB_NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::DSH_CHATGPT_SUB_NPM_TOKEN is missing. Add a granular npm access token (All Packages, Read and write, Bypass 2FA) as the repository secret DSH_CHATGPT_SUB_NPM_TOKEN."
            exit 1
          fi
          # 不把 whoami 当失败条件：Bypass-2FA 的 granular token 从 2026-08 起会被
          # 拒绝账户身份类查询，用它判「token 坏了」会误报。发布结果才是判据。
          if npm whoami >/dev/null 2>&1; then
            echo "npm token accepted for identity lookup."
          else
            echo "::warning::npm whoami did not confirm the token (expected for bypass-2FA tokens since 2026-08); the publish step is the real check."
          fi
          echo "ready to publish (node $(node --version), npm $(npm --version))."

      # prepublishOnly 会先 npm run build，保证 npm 包里的 lib/ 与 src/ 一致。
      - name: Publish package
        if: ${{ inputs.verify_only != true }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DSH_CHATGPT_SUB_NPM_TOKEN }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          # 幂等 1：版本已经在 npm 上，直接跳过（重跑旧标签不该报红）。
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${package_name}@${version} 已经在 npm 上，跳过发布。"
            exit 0
          fi

          if output="$(npm publish --access public 2>&1)"; then
            printf '%s\n' "$output"
            echo "::notice::npm 已受理 ${package_name}@${version}。服务端校验是异步的（通常 1~2 分钟，偶发十几分钟），公开可用性由 Verify npm release 工作流后台读回确认。"
            exit 0
          else
            status=$?
          fi
          printf '%s\n' "$output"

          # 幂等 2：版本正在 npm 服务端 validating 时重复 publish 会 403。
          # 那说明包已经在 npm 手上了，不是发布失败。
          if printf '%s' "$output" | grep -q "cannot publish over the previously published versions"; then
            echo "::notice::${package_name}@${version} 已存在或正在 npm 服务端处理中，按幂等处理。"
            exit 0
          fi

          # npm 用 404 掩盖「无权限」，所以 401/404 基本都指向 token 本身。
          if printf '%s' "$output" | grep -Eq "E404|E401|40[13] (Not Found|Forbidden|Unauthorized)"; then
            echo "::error::npm 拒绝了这次发布（401/404）。多半是 DSH_CHATGPT_SUB_NPM_TOKEN 的问题：没有覆盖这个包、没勾 Bypass two-factor authentication、或已过期。请重新生成 granular token（All Packages + Read and write (publish and stage) + Bypass 2FA）并替换仓库 secret。"
          fi
          exit "$status"
