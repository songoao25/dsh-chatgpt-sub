name: Publish NPM package

# 这个 job 的契约只有一条：**只发不等**。
#
# npm 的发布是异步的：`npm publish` 返回 0 只代表「已受理」，版本要等服务端扫描/校验
# （生命周期状态 validating）结束后才会公开可下载。实测「上传完成 → 公开可下载」的延迟：
#   2026-09-26  v1.20.4~v1.20.8   74s ~ 157s
#   2026-09-30  v1.20.9           1098s（≈18 分钟）
#   2026-09-30  v1.20.10          >25 分钟
#
# 一旦把「等它公开」写进这个 job，发包耗时就等于 npm 的服务端队列耗时 ——
# 2026-09-30 v1.20.10 正是这样从几十秒变成十几分钟、并且常常判红的。
#
# 公开可用性改由独立的 verify-npm-release.yml 后台读回校验，不阻塞这里。
#
# 认证：npm Trusted Publishing（OIDC），不使用长期密钥。
# job 需要 permissions: id-token: write；npm CLI 会把 GitHub 签发的 OIDC token
# 换成一次性的发布凭证。前置条件（一次性，在 npm 网站上配）：
#   包 → Settings → Trusted Publisher → GitHub Actions：
#   Organization or user = songoao25、Repository = dsh-chatgpt-sub、
#   Workflow filename = publish-npm.yml、Allowed actions 勾上允许 npm publish。
# 注意 1：可信发布者配置创建后 2 天内必须成功发布一次，否则配置失效（重配即可）。
# 注意 2：只勾了 stage publish 的话，npm 只会把版本放进待审队列，不会公开
#   （2026-10-13 用 granular token 的 stage-only 权限实测踩到过这个坑）。
on:
  push:
    tags:
      - 'v*.*.*'
  # 手动兜底：自动链断了还能人工发版（幂等，重跑已发布版本不会判红）。
  workflow_dispatch:
    inputs:
      verify_only:
        description: Check publishing authentication without publishing
        type: boolean
        default: false

permissions:
  # OIDC：npm 可信发布需要签发 id-token；其余权限保持只读。
  id-token: write
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish dsh-chatgpt-sub to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 可信发布要求 npm CLI >= 11.5.1、Node >= 22.14；Node 24 自带 npm 11.x。
          # 旧 CLI（npm 10）不认识 staged publishing：stage-only 权限会被静默暂存，
          # 日志却打印发布成功，所以这里必须用新 npm。
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$package_version" ]; then
              echo "Tag version $tag_version does not match package version $package_version"
              exit 1
            fi
          fi
          echo "Releasing dsh-chatgpt-sub@$package_version"

      - name: Check OIDC publishing environment
        shell: bash
        run: |
          # 没有长期密钥可验：这里只确认 job 拿到了签发 OIDC token 的权限。
          # 包级授权（可信发布者是否覆盖本 workflow、是否允许直接发布）由
          # registry 在发布时判定。
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "::error::OIDC token request is unavailable. Add 'permissions: id-token: write' to this workflow."
            exit 1
          fi
          echo "OIDC token request available (node $(node --version), npm $(npm --version))."

      # prepublishOnly 会先 npm run build，保证 npm 包里的 lib/ 与 src/ 一致。
      - name: Publish package
        if: ${{ inputs.verify_only != true }}
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          # 幂等 1：版本已经在 npm 上，直接跳过（重跑旧标签不该报红）。
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${package_name}@${version} 已经在 npm 上，跳过发布。"
            exit 0
          fi

          if output="$(npm publish --access public 2>&1)"; then
            printf '%s\n' "$output"
            echo "::notice::npm 已受理 ${package_name}@${version}。服务端校验是异步的（通常 1~2 分钟，偶发十几分钟），公开可用性由 Verify npm release 工作流后台读回确认。"
            exit 0
          else
            status=$?
          fi
          printf '%s\n' "$output"

          # 幂等 2：版本正在 npm 服务端 validating 时重复 publish 会 403。
          # 那说明包已经在 npm 手上了，不是发布失败。
          if printf '%s' "$output" | grep -q "cannot publish over the previously published versions"; then
            echo "::notice::${package_name}@${version} 已存在或正在 npm 服务端处理中，按幂等处理。"
            exit 0
          fi

          # 可信发布者只允许 stage publish 时，registry 会要求改用 npm stage publish。
          if printf '%s' "$output" | grep -q "E_STAGE_REQUIRED"; then
            echo "::error::这次发布被要求走 staged publishing（E_STAGE_REQUIRED）。请在 npm 的可信发布者配置里勾上允许 npm publish（只勾 stage publish 不会公开版本）。"
          fi

          # npm 用 404 掩盖「无权限」，401/404 基本都指向可信发布者配置对不上。
          if printf '%s' "$output" | grep -Eq "E404|E401|40[13] (Not Found|Forbidden|Unauthorized)"; then
            echo "::error::npm 拒绝了这次发布（401/404）。多为可信发布者配置问题：仓库名或工作流文件名对不上、配置过期（创建后 2 天内没成功发布过）、或没勾允许 npm publish。"
          fi
          exit "$status"
