name: Auto-merge own PRs

# 目标：仓库拥有者 songoao25 的 PR（**含发版 PR**）自动开启 auto-merge，
# 必需检查 CI 一过就自动 squash 合并；其他人的 PR 保持人工 review。
#
# 2026-10-14 变更（用户拍板「自动审核 / 自动批准 / 自动合并 / 自动发版」）：
# 撤掉 2026-09-11 之后加的「发版 PR 排除」三道判断（分支名 release-please--*、
# autorelease: 标签、chore(main): release 标题）。那次 v2.0.0 误发事故的根因是
# **有人手工改了版本元数据**：Release Please 因此失去「上次发布」的基准，把全部历史
# 当成未发布内容、算出错误的大版本，而当时的发版 PR 是自动合并的，于是直接发了出去。
#
# 撤掉人工闸门的同时，风险改由 CI 里的机器守卫接管（tests/test-source-guards.mjs）：
#   ① 普通 PR 不得手工修改版本元数据（逃生舱 [release-metadata-override]）；
#   ② 发版 PR 只允许改那四个版本文件，且 manifest 与 package.json 的新版本必须一致。
# 两条都由必需检查 CI 强制：任一不过，auto-merge 就永远等不到合并条件。
#
# 分支保护不要求任何人的批准（required_approving_review_count = 0），所以整条链是
# 自动审核（CI + CodeQL）→ 自动批准（无需人工批准）→ 自动合并（这里）→ 自动发版（标签触发）。
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    # owner 自己的 PR（含发版 PR）自动合并；draft 不自动合；别人的 PR 留人工。
    if: >-
      github.event.pull_request.user.login == github.repository_owner
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Report automation token mode
        env:
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "::warning::AUTOMATION_TOKEN is not configured; auto-merge will work, but release/publish workflows may need manual dispatch."
          else
            echo "AUTOMATION_TOKEN is configured; downstream workflow triggers are enabled."
          fi
      - name: Enable auto-merge (squash) for owner PR
        run: |
          echo "Owner PR #${{ github.event.pull_request.number }} by ${{ github.event.pull_request.user.login }} → enable auto-merge (squash)"
          gh pr merge --auto --squash "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
        env:
          # Prefer an owner PAT so merged PRs can trigger downstream workflows;
          # fall back to GITHUB_TOKEN so missing optional configuration does not
          # block the repository owner's normal auto-merge path.
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
